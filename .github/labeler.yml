# Documentation changes
documentation:
  - changed-files:
    - any-glob-to-any-file: ['docs/**/*', '*.md', '*.mdx']

# Core / internal code
core:
  - changed-files:
    - any-glob-to-any-file:
      - 'cmd/**/*'
      - 'internal/**/*'

# Plugins
plugins:
  - changed-files:
    - any-glob-to-any-file:
      - 'plugins/**/*'

# Go files
go:
  - changed-files:
    - any-glob-to-any-file: '**/*.go'

# Docker/Infrastructure
infrastructure:
  - changed-files:
    - any-glob-to-any-file:
      - '**/Dockerfile'
      - '**/Dockerfile.*'
      - '**/docker-compose*.yml'
      - '**/*.dockerfile'
      - 'grafana/**/*'
      - 'prometheus.yml'

# CI/CD changes
ci-cd:
  - changed-files:
    - any-glob-to-any-file:
      - '.github/**/*'
      - '**/.github/**/*'

# Dependencies
dependencies:
  - changed-files:
    - any-glob-to-any-file:
      - 'go.mod'
      - 'go.sum'

# Tests
tests:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*_test.go'
      - 'test/**/*'

# Configuration files
config:
  - changed-files:
    - any-glob-to-any-file:
      - 'config/**/*'
      - '**/*.yaml'
      - '**/*.yml'
      - '**/*.json'
      - '**/*.json5'
      - '**/*.xml'
      - '**/*.toml'
      - '**/*.ini'
      - '**/*.conf'
