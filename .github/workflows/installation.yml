name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Cache zenoh-c
        uses: actions/cache@v4
        with:
          path: .zenoh-c
          key: ${{ runner.os }}-zenoh-c-1.9.0
          restore-keys: |
            ${{ runner.os }}-zenoh-c-

      - name: Download zenoh-c
        run: make download-zenohc

      - name: Build binary
        run: make build

      - name: Verify binary
        run: test -x ./build/om1 && echo "Binary built successfully"
