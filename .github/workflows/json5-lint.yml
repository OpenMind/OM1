name: JSON5 Config Lint

on:
  pull_request:
    paths:
      - "config/**/*.json5"
      - "scripts/lint_json5.py"

jobs:
  lint-json5:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install JSON5 dependency
        run: |
          python -m pip install --upgrade pip
          pip install json5

      - name: Run JSON5 lint script
        run: |
          python scripts/lint_json5.py
