global:
  scrape_interval: 1s

scrape_configs:
  - job_name: 'om1'
    static_configs:
      - targets: ['host.docker.internal:9090']

  - job_name: 'om1_quality_historical'
    scrape_interval: 30s
    static_configs:
      - targets: ['host.docker.internal:9200']

  - job_name: 'om1_quality_live'
    scrape_interval: 5s
    static_configs:
      - targets: ['host.docker.internal:9201']
